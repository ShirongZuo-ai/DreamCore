catalog_version: "dreamcore.dataset_library.v1"
raw_root: "data/datasets/raw"
session_package_root: "data/session_packages"
catalog_output: "data/dataset_catalog_v1.json"
audit_output: "results/dataset_library_v1_audit.json"
viewer:
  default_start_s: 0.0
  default_time_s: 0.0
  default_window_duration_s: 60.0
  window_duration_options_s: [30.0, 60.0, 120.0]
  display_max_points_per_signal: 2000
  feature_timestamp_semantics: "window_end"
  stage_jump_time_s: null
  activity_jump_time_s: null
  replay:
    enabled: true
    tick_interval_ms: 250
    default_speed: 1.0
    speed_options: [0.5, 1.0, 2.0, 5.0, 10.0]
    cache_max_windows: 3
    prefetch_threshold_fraction: 0.75
    seek_cursor_fraction: 0.25
    intervention_notice_duration_ms: 5000
    intervention_marker_color: "#E1AA5A"
    provenance_notice: "SIMULATED INTERVENTION — NO HARDWARE COMMAND SENT"
cross_dataset_eog_validation:
  output: "results/dataset_library_v1_eog_validation.json"
  window_start_s: 3600.0
  window_duration_s: 600.0
  recordings:
    - {session_id: "SC4002", channels: ["EOG horizontal"]}
    - {session_id: "SN001", channels: ["EOG E1-M2", "EOG E2-M2"]}
    - {session_id: "SN002", channels: ["EOG E1-M2", "EOG E2-M2"]}
    - {session_id: "isruc-c3-01", channels: ["LOC-A2", "ROC-A1"]}
    - {session_id: "isruc-c3-02", channels: ["LOC-A2", "ROC-A1"]}
signal_role_rules:
  - {pattern: "(?i)(EOG horizontal|E1[- ]E2)", canonical_role: "EOG_HORIZONTAL", modality: "eog"}
  - {pattern: "(?i)(EOG.*left|Left EOG|LOC|E1[/ -])", canonical_role: "EOG_LEFT", modality: "eog"}
  - {pattern: "(?i)(EOG.*right|Right EOG|ROC|E2[/ -])", canonical_role: "EOG_RIGHT", modality: "eog"}
  - {pattern: "(?i)(EOG|electroocul)", canonical_role: "EOG_HORIZONTAL", modality: "eog"}
  - {pattern: "(?i)(EEG F|^Fp|^F[0-9z]|F[0-9z][-/])", canonical_role: "EEG_FRONTAL", modality: "eeg"}
  - {pattern: "(?i)(EEG C|^C[0-9z]|C[0-9z][-/])", canonical_role: "EEG_CENTRAL", modality: "eeg"}
  - {pattern: "(?i)(EEG.*O|Pz-Oz|^O[0-9z]|O[0-9z][-/])", canonical_role: "EEG_OCCIPITAL", modality: "eeg"}
  - {pattern: "(?i)(EEG|^[FCPOT][p0-9z]+[-/])", canonical_role: "EEG_OTHER", modality: "eeg"}
  - {pattern: "(?i)(EMG|chin|submental)", canonical_role: "EMG", modality: "emg"}
  - {pattern: "(?i)(ECG|EKG)", canonical_role: "ECG", modality: "ecg"}
  - {pattern: "(?i)(resp|airflow|nasal|thorax|abdomen|snore)", canonical_role: "RESPIRATORY", modality: "respiratory"}
  - {pattern: ".*", canonical_role: "OTHER", modality: "other"}
download:
  timeout_s: 900
  retries: 20
  chunk_size_bytes: 1048576
  user_agent: "DreamCore-Dataset-Library-V1/1.0"
  max_parallel_files: 12

