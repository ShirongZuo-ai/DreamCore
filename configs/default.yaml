    eye_movement:
      rule: "minimum_cost_one_to_one_candidate_point_to_expert_interval"
      primary_tolerance_s: 0.0
      sensitivity_tolerances_s: [0.0, 0.25, 0.5, 1.0]
      timing_offset: "candidate_peak_minus_expert_interval_midpoint"
  alpha_synthetic:
