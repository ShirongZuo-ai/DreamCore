# DreamCore default configuration
# ⚠ RESEARCH DEFAULTS ONLY — not final hardware specs.
# All values are placeholders. Update when real hardware parameters are known.

# ── General ──────────────────────────────────────────────────────────
general:
  project_name: "dreamcore"
  random_seed: 42
  log_level: "INFO"

# ── Read-only Session HTTP Transport ─────────────────────────────────
# Local offline viewer transport only. No streaming or command endpoints.
session_transport:
  api_version: "v1"
  host: "127.0.0.1"
  port: 8765
  session_package_root: "data/session_packages"
  max_signal_window_s: 120.0
  cors_allowed_origins:
    - "http://127.0.0.1:4173"
    - "http://localhost:4173"

# ── EEG Data ─────────────────────────────────────────────────────────
# Sampling rate is unknown until hardware is selected. 100 Hz is a
# common research default; replace with actual hardware spec later.
eeg:
  sampling_rate_hz: 100          # TODO: replace with real hardware spec
  channel_names: []              # TODO: populate after electrode layout known
  reference: "unknown"           # "mastoid", "cz", "average", etc.
  unit: "uV"
  montage: "unknown"             # 10-20, 10-10, custom

# ── Data Loading & Quality ───────────────────────────────────────────
data:
  preload_edf: false             # false keeps large recordings memory efficient
  sampling_rate_tolerance_hz: 0.01
  quality:
    flatline_threshold_s: 5.0    # flag identical runs longer than this duration
    max_nan_ratio: 0.0           # per-channel ratio allowed for an overall pass
    std_ddof: 0                  # population standard deviation

# ── Preprocessing ────────────────────────────────────────────────────
# Research comparison profiles only — these are not final product parameters.
preprocessing:
  active_profile: "slow_oscillation_observation"
  eeg_channels: []               # supplied by a dataset config or CLI
  profiles:
    raw_eeg:
      reference:
        mode: "none"             # "none" | "average" | "channels"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: null
        high_hz: null
        method: "fir"
      detrend: "none"            # "none" | "demean" | "linear"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 0.0
    broadband_sleep_eeg:
      reference:
        mode: "none"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: 0.5
        high_hz: 30.0
        method: "fir"
      detrend: "demean"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 5.0
    slow_oscillation_observation:
      reference:
        mode: "none"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: 0.5
        high_hz: 4.0
        method: "fir"
      detrend: "demean"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 5.0

# ── N3 EEG Visualization ─────────────────────────────────────────────
n3_visualization:
  segment_id: null               # set to a representative segment per dataset
  preprocessing_profile: "slow_oscillation_observation"
  amplitude_scale: 1000000.0     # EDF volts -> displayed microvolts
  amplitude_unit: "µV"
  figure_width_inches: 14.0
  figure_height_per_channel_inches: 3.2
  dpi: 160
  raw_color: "#6B7280"
  processed_color: "#2563EB"
  raw_line_width: 0.7
  processed_line_width: 1.0
  raw_line_style: ":"
  processed_line_style: "-"
  grid_alpha: 0.18
  windows:
    long:
      offset_s: 60.0
      duration_s: 120.0
      output_path: "results/n3_eeg_long.png"
    short:
      offset_s: 90.0
      duration_s: 20.0
      output_path: "results/n3_eeg_short.png"
  summary_json: "results/n3_eeg_preprocessing_summary.json"
  json_indent: 2

# ── Sleep Staging ────────────────────────────────────────────────────
sleep_staging:
  # Unified label -> accepted raw dataset labels.
  stage_labels:
    W: ["Sleep stage W", "W", "Wake", "0"]
    N1: ["Sleep stage 1", "N1", "S1", "1"]
    N2: ["Sleep stage 2", "N2", "S2", "2"]
    N3: ["Sleep stage 3", "Sleep stage 4", "N3", "S3", "S4", "3", "4", "SWS"]
    REM: ["Sleep stage R", "R", "REM", "5"]
    UNKNOWN: ["Sleep stage ?", "UNKNOWN"]
    MOVEMENT: ["Movement time", "MOVEMENT"]
  unknown_label_policy: "map_to_unknown"  # "map_to_unknown" | "raise"
  unknown_label: "UNKNOWN"
  merge_tolerance_s: 0.0
  focus_stages: ["N2", "N3"]

# ── N3 Segment Extraction ────────────────────────────────────────────
n3_extraction:
  target_label: "N3"
  min_segment_duration_s: 30.0
  eeg_channels: []               # must be supplied by dataset config or CLI
  output_csv: "results/n3_segments.csv"
  output_json: "results/n3_segments.json"
  json_indent: 2

# ── Slow Oscillation Detection ───────────────────────────────────────
# Candidate-generation research defaults only — not physiological ground truth
# and not product parameters.
slow_oscillation:
  active_profile: "strict_slow_oscillation"
  amplitude_scale_to_uv: 1000000.0
  profiles:
    broad_slow_wave:
      detection_band: {low_hz: 0.5, high_hz: 4.0, method: "fir"}
      duration:
        negative_halfwave_min_s: 0.125
        negative_halfwave_max_s: 1.0
        full_cycle_min_s: 0.25
        full_cycle_max_s: 2.0
      amplitude:
        strategy: "none"         # "none" | "fixed" | "adaptive_quantile"
        metric: "peak_to_peak_amplitude_uv"
        fixed_min_uv: null
        quantile: 0.75
      artifact_rejection:
        boundary_exclusion_s: 2.0
        max_peak_to_peak_uv: 500.0
        invalid_time_masks: []   # absolute half-open PSG ranges
    strict_slow_oscillation:
      detection_band: {low_hz: 0.5, high_hz: 1.25, method: "fir"}
      duration:
        negative_halfwave_min_s: 0.3
        negative_halfwave_max_s: 1.2
        full_cycle_min_s: 0.8
        full_cycle_max_s: 2.0
      amplitude:
        strategy: "adaptive_quantile"
        metric: "peak_to_peak_amplitude_uv"
        fixed_min_uv: null
        quantile: 0.75
      artifact_rejection:
        boundary_exclusion_s: 2.0
        max_peak_to_peak_uv: 500.0
        invalid_time_masks: []
  overlap:
    accepted_only: true
    min_overlap_s: 0.0
  output_csv: "results/slow_oscillation_events.csv"
  summary_json: "results/slow_oscillation_summary.json"
  json_indent: 2
  qa:
    segment_id: null
    preprocessing_profile: "broadband_sleep_eeg"
    offset_s: 90.0
    duration_s: 20.0
    output_path: "results/slow_oscillation_qa.png"
    figure_width_inches: 14.0
    figure_height_per_channel_inches: 3.4
    dpi: 160
    amplitude_scale: 1000000.0
    amplitude_unit: "µV"
    raw_color: "#6B7280"
    detection_color: "#1D4ED8"
    accepted_color: "#2563EB"
    rejected_color: "#D97706"
    grid_alpha: 0.18

# ── Offline Hilbert Phase Estimation ─────────────────────────────────
# Research baseline only. Zero-phase FIR and Hilbert use future samples.
hilbert_phase:
  active_profile: "offline_strict_so"
  amplitude_scale_to_uv: 1000000.0
  profiles:
    offline_strict_so:
      phase_band:
        low_hz: 0.5
        high_hz: 1.25
        method: "fir"
        phase: "zero"
      project_phase_offset_rad: -3.141592653589793
      boundary_invalid_s: 5.0
      min_signal_duration_s: 10.0
      constant_std_tolerance: 0.0
      amplitude_envelope:
        strategy: "adaptive_quantile"  # "none" | "fixed" | "adaptive_quantile"
        fixed_min_uv: null
        quantile: 0.10
      instantaneous_frequency:
        enabled: true
        min_hz: 0.2
        max_hz: 2.0
      invalid_time_masks: []
      expected_landmark_phases_rad:
        downward_zero_crossing: -1.5707963267948966
        trough: 0.0
        upward_zero_crossing: 1.5707963267948966
        positive_peak: 3.141592653589793
      event_validation:
        reverse_step_tolerance_rad: 0.05
        max_reverse_step_fraction: 0.05
        min_forward_advance_rad: 3.141592653589793
        min_event_valid_fraction: 0.90
  cross_channel:
    accepted_only: true
    min_overlap_s: 0.0
    comparison_time: "overlap_midpoint"
  landmarks_csv: "results/hilbert_phase_landmarks.csv"
  summary_json: "results/hilbert_phase_summary.json"
  json_indent: 2
  qa:
    segment_id: null
    preprocessing_profile: "broadband_sleep_eeg"
    detector_profile: "strict_slow_oscillation"
    phase_profile: "offline_strict_so"
    offset_s: 90.0
    duration_s: 20.0
    output_path: "results/hilbert_phase_qa.png"
    figure_width_inches: 15.0
    figure_height_inches: 10.5
    dpi: 160
    amplitude_unit: "µV"
    signal_color: "#1D4ED8"
    phase_color: "#2563EB"
    envelope_color: "#1E40AF"
    invalid_color: "#D97706"
    accepted_color: "#2563EB"
    grid_alpha: 0.18

# ── Pre-sleep Alpha V1 Research Baseline ─────────────────────────────
# Derived features use observed EEG. Demand/events are simulated abstract
# control quantities and are never ultrasound dose, delivery, or response.
alpha:
  active_profile: "fixed_alpha"
  comparison_profile: "individualized_alpha"
  input_scale_to_uv: 1000000.0
  channels: []
  profiles:
    fixed_alpha:
      band_strategy: "fixed"
      fixed_band: {low_hz: 8.0, high_hz: 13.0}
      individualized_band: {half_width_hz: 2.0, fallback_to_fixed: false}
      spectral:
        total_power_band: {low_hz: 0.5, high_hz: 30.0}
        welch_segment_s: 4.0
        welch_overlap_fraction: 0.5
        welch_window: "hann"
        welch_detrend: "constant"
        filter_method: "fir"
        filter_phase: "zero"
      iaf:
        search_band_low_hz: 7.0
        search_band_high_hz: 14.0
        edge_margin_hz: 0.5
        min_prominence_db: 3.0
        high_confidence_prominence_db: 10.0
        product_display_min_confidence: 1.0
    individualized_alpha:
      band_strategy: "individualized"
      fixed_band: {low_hz: 8.0, high_hz: 13.0}
      individualized_band: {half_width_hz: 2.0, fallback_to_fixed: false}
      spectral:
        total_power_band: {low_hz: 0.5, high_hz: 30.0}
        welch_segment_s: 4.0
        welch_overlap_fraction: 0.5
        welch_window: "hann"
        welch_detrend: "constant"
        filter_method: "fir"
        filter_phase: "zero"
      iaf:
        search_band_low_hz: 7.0
        search_band_high_hz: 14.0
        edge_margin_hz: 0.5
        min_prominence_db: 3.0
        high_confidence_prominence_db: 10.0
        product_display_min_confidence: 1.0
  quality:
    min_finite_ratio: 0.99
    min_standard_deviation_uv: 0.1
    max_standard_deviation_uv: 200.0
    max_peak_to_peak_uv: 1000.0
    max_flatline_ratio: 0.05
    invalid_score_ceiling: 0.25
  windowing:
    analysis_window_s: 30.0
    step_s: 10.0
  history:
    short_window_s: 60.0
    trend_window_s: 300.0
    baseline_window_s: 300.0
    minimum_points: 3
    minimum_time_coverage_ratio: 0.7
    stable_slope_fraction_per_min: 0.01
  state:
    awake_alpha_ratio: 0.95
    drowsy_alpha_ratio: 0.60
    full_scale_alpha_drop_fraction: 0.40
    trend_drowsiness_scores:
      rising: 0.0
      stable: 0.35
      falling: 1.0
    weights: {low_alpha: 0.35, alpha_drop: 0.35, trend: 0.30}
  simulated_demand:
    initial_demand: 0.0
    initial_observation_step_s: 10.0
    minimum_valid_observation_s: 120.0
    minimum_state_confidence: 0.65
    minimum_active_demand: 0.15
    maximum_demand: 1.0
    drowsiness_reduction_weight: 0.85
    falling_trend_multiplier: 0.65
    smoothing_time_constant_s: 90.0
    max_rise_per_minute: 0.20
    max_fall_per_minute: 0.30
    demand_hysteresis_deadband: 0.03
    ready_drowsiness_entry: 0.75
    ready_drowsiness_exit: 0.60
    ready_alpha_change_max: -0.25
    ready_allowed_trends: ["falling", "stable"]
    ready_sustain_s: 120.0
    ready_demand_max: 0.05
    stopped_demand_threshold: 0.02
    event_change_threshold: 0.01
    event_drowsiness_label_threshold: 0.50
  evaluation:
    start_s: null
    end_s: null
    stages: ["W", "N1", "N2"]
    iaf_baseline_start_s: null
    iaf_baseline_end_s: null
    control_channel: null
  output:
    features_csv: "results/alpha_v1_features.csv"
    summary_json: "results/alpha_v1_summary.json"
    qa_png: "results/alpha_v1_qa.png"
    json_indent: 2
  session_package:
    manifest_path: "data/session_packages/sleep-edf/alpha-v1/manifest.json"
    session_id: "alpha-v1"
    viewer:
      default_start_s: null
      default_time_s: null
      default_window_duration_s: 120.0
      window_duration_options_s: [30.0, 60.0, 120.0]
      display_max_points_per_signal: 2000
      feature_timestamp_semantics: "window_end"
      stage_jump_time_s: null
      replay:
        enabled: true
        tick_interval_ms: 250
        default_speed: 1.0
        speed_options: [0.5, 1.0, 2.0, 5.0, 10.0]
        cache_max_windows: 3
        prefetch_threshold_fraction: 0.75
        seek_cursor_fraction: 0.25
        intervention_notice_duration_ms: 5000
        intervention_marker_color: "#E1AA5A"
        provenance_notice: "SIMULATED INTERVENTION — NO ULTRASOUND DELIVERED"
  qa:
    start_s: null
    duration_s: 600.0
    raw_display_window_s: 30.0
    figure_width_inches: 16.0
    figure_height_inches: 15.0
    dpi: 160
    observed_color: "#6B7280"
    derived_color: "#2563EB"
    comparison_color: "#1E40AF"
    simulated_color: "#D97706"
    stage_colors: {W: "#E5E7EB", N1: "#BFDBFE", N2: "#93C5FD"}
    grid_alpha: 0.18

# ── Eye-Movement / EOG Research V1 ──────────────────────────────────
# Primary exploratory research signal. Channel labels are discovered from
# recording metadata using these configurable rules; no electrode is silently
# substituted. Candidate events are signal-processing hypotheses, not REM or
# dream labels.
eye_movement:
  feature_version: "eye-movement-v1"
  input_scale_to_uv: 1000000.0
  channel_discovery:
    preferred_mne_types: ["eog"]
    label_patterns: ['(?i)(^|[\s_-])eog([\s_-]|$)']
    require_unique: true
  filtering:
    low_hz: 0.3
    high_hz: 10.0
    method: "butterworth"
    order: 4
    phase: "zero"
  windowing:
    analysis_window_s: 4.0
    step_s: 1.0
    timestamp_semantics: "window_end"
  quality:
    min_finite_ratio: 0.99
    min_standard_deviation_uv: 0.1
    max_peak_to_peak_uv: 1000.0
  normalization:
    low_quantile: 0.05
    high_quantile: 0.95
    epsilon: 1.0e-9
  local_baseline:
    duration_s: 60.0
    robust_scale_factor: 1.4826
  event_detection:
    activity_robust_z_threshold: 3.0
    minimum_separation_s: 0.5
    minimum_duration_s: 0.1
    maximum_duration_s: 2.0
    peak_width_relative_height: 0.5
    confidence_saturation_z: 10.0
    event_rate_history_s: 30.0
  output:
    features_csv: "results/eye_movement_v1_features.csv"
    events_csv: "results/eye_movement_v1_events.csv"
    filtered_signal_binary: "results/eye_movement_v1_filtered_eog.f32"
    indexed_artifact_database: "results/eye_movement_v1.sqlite"
    summary_json: "results/eye_movement_v1_summary.json"
    json_indent: 2
  session_package:
    manifest_path: "data/session_packages/sleep-edf/eye-movement-v1/manifest.json"
    session_id: "eye-movement-v1"
    viewer:
      default_start_s: null
      default_time_s: null
      default_window_duration_s: 120.0
      window_duration_options_s: [30.0, 60.0, 120.0]
      display_max_points_per_signal: 2000
      feature_timestamp_semantics: "window_end"
      activity_jump_time_s: null

# Cross-dataset detector validation is configured separately so its frozen
# contract and human-review layer cannot mutate Eye Movement V1 parameters.
eog_validation:
  config_path: "configs/eog_validation_v1.yaml"

# ── Product automatic local analyses ───────────────────────────────────
# These settings control local product orchestration and cache identity. They
# are not physiological parameters and never trigger an external music model.
automatic_analysis:
  schema_version: "dreamcore.automatic_analysis.v1"
  api_prefix: "/api/analysis/v1"
  cache_root: "results/product_analysis_v1"
  maximum_workers: 1
  status_poll_interval_ms: 500
  json_indent: 2
  alpha:
    feature_key: "alpha"
    algorithm_version: "alpha-product-v1"
    maximum_channels: 1
    canonical_role_priority:
      - "EEG_OCCIPITAL"
      - "EEG_CENTRAL"
      - "EEG_FRONTAL"
      - "EEG_OTHER"
    analysis_window_s: 30.0
    step_s: 30.0
    input_scale_to_uv_by_unit:
      uV: 1.0
      µV: 1.0
      V: 1000000.0
    stage_annotation_type: "sleep_stages"
  eye_movement:
    feature_key: "eye_movement"
    algorithm_version: "eye-movement-v1"
    maximum_channels: 2
    reusable_validation_root: "results/eog_validation_v1/derived"
    validation_contract: "results/eog_validation_v1/validation_contract.json"
  wake_music_profile:
    feature_key: "wake_music_profile"
    algorithm_version: "wake-music-profile-v1"
  k_complex:
    feature_key: "k_complex"
    algorithm_version: "k-complex-morphology-b1-v1"
    maximum_channels: 1
    canonical_role_priority:
      - "EEG_FRONTAL"
      - "EEG_CENTRAL"
      - "EEG_OTHER"
      - "EEG_OCCIPITAL"
    focus_role_priority:
      - "EEG_FRONTAL"
      - "EEG_CENTRAL"
    maximum_focus_channels: 4
    input_scale_to_uv_by_unit:
      uV: 1.0
      µV: 1.0
      V: 1000000.0
    stage_annotation_type: "sleep_stages"
    focus_half_window_s: 5.0
    maximum_request_bytes: 8192
    maximum_notes_characters: 1000
    review_labels: ["Looks right", "Wrong", "Uncertain"]
    verifier:
      method: "morphology_b1"
      version: "k-complex-morphology-b1-v1"
      artifact_path: "configs/models/k_complex_morphology_b1.json"
      artifact_checksum: "ea4aa28d79a01af90a09d9474cfc25e461aafbca4b329a518e70251553b9b869"
      decision_threshold: 0.5
      default_enabled: true
      sanity_output_root: "results/k_complex_morphology_b1_v1"
      sanity_session_id: "SN001"
      sanity_expected_v0_candidate_count: 226

# Retrospective morphology detector. This complete-waveform V0 is explicitly
# non-causal and makes no before-trough or lead-time claim.
k_complex_v0:
  detector_version: "k_complex_v0"
  stage_gating:
    enabled: true
    primary_stage: "N2"
    annotation_type: "sleep_stages"
    bout_merge_tolerance_s: 0.001
  filtering:
    low_hz: 0.3
    high_hz: 4.0
    method: "butterworth"
    order: 4
    phase: "zero"
  baseline:
    strategy: "local_median_mad"
    local_window_s: 20.0
    robust_scale_factor: 1.4826
    minimum_scale_uv: 1.0
  candidate:
    negative_depth_robust_z: 5.0
    prominence_robust_z: 4.0
    confidence_saturation_z: 8.0
  morphology:
    onset_search_s: 1.5
    negative_halfwave_min_s: 0.10
    negative_halfwave_max_s: 1.50
    positive_peak_min_delay_s: 0.10
    positive_peak_max_delay_s: 1.50
    positive_peak_min_robust_z: 1.0
    end_search_after_peak_s: 1.0
    event_duration_min_s: 0.50
    event_duration_max_s: 2.50
    require_positive_peak: false
  refractory_interval_s: 0.80
  artifact_rejection:
    minimum_finite_ratio: 0.99
    maximum_absolute_amplitude_uv: 500.0
    maximum_peak_to_peak_uv: 750.0
  score:
    negative_depth_weight: 0.55
    prominence_weight: 0.30
    positive_component_weight: 0.15
    high_confidence_min: 0.75
    medium_confidence_min: 0.50

# Optional, explicitly triggered frozen foundation-model verifier. It never
# changes K-Complex V0 proposal thresholds or trough timing.
cbramod_kc_v1:
  adapter_version: "dreamcore-cbramod-adapter-v1"
  verifier_version: "cbramod-kc-linear-v1"
  status: "research_comparison_only"
  default_enabled: false
  output_root: "results/cbramod_kc_v1"
  cached_session_predictions:
    SN001: "hmc_sn001_inference.csv"
  device: "auto"
  checkpoint_path: ".cache/foundation_models/cbramod/pretrained_weights.pth"
  checkpoint_sha256: "0792cb808c14e6b7a2bb2ce1dff379bc47bc54c49a779825bdfeb33bf8157178"
  model_sampling_rate_hz: 200.0
  volts_to_microvolts: 1000000.0
  resampling_max_denominator: 1000
  context_before_s: 5.0
  context_after_s: 5.0
  exclusion_margin_s: 1.0
  random_seed: 1729
  benchmark_contract_frozen_at: "2026-08-17T03:49:14.913174+00:00"
  channel_policy: "all available compatible EEG channels; never fabricate missing channels"
  filtering:
    low_hz: 0.3
    high_hz: 75.0
    order: 5
    nyquist_guard: 0.99
    notch_hz: 60.0
    notch_quality: 30.0
  architecture:
    patch_points: 200
    out_dim: 200
    d_model: 200
    dim_feedforward: 800
    layers: 12
    nhead: 8
    dropout: 0.1
  split_protocol: "leave-one-DREAMS-excerpt-out"
  classifier:
    linear_max_iterations: 2000
    class_weight: "balanced"
    decision_threshold: 0.5
  operating_point:
    minimum_recall_retained: 0.90

# ── Signal Validation V1 ─────────────────────────────────────────────
# Explicit internal benchmark job. It never runs when the Viewer opens and
# never mutates the frozen Alpha, Eye Movement V1, or K-complex V0 thresholds.
signal_validation_v1:
  schema_version: "dreamcore.signal_validation.contract.v1"
  validation_version: "signal_validation_v1.4"
  revision_note: "V1.4 adds explicit Alpha absolute-power relative-error summaries against theoretical injected sinusoid power; V1.3 preserved legacy DREAMS EDF microvolt magnitudes and earlier revisions corrected unit/header parsing. No production thresholds changed."
