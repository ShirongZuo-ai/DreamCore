# DreamCore default configuration
# ⚠ RESEARCH DEFAULTS ONLY — not final hardware specs.
# All values are placeholders. Update when real hardware parameters are known.

# ── General ──────────────────────────────────────────────────────────
general:
  project_name: "dreamcore"
  random_seed: 42
  log_level: "INFO"

# ── EEG Data ─────────────────────────────────────────────────────────
# Sampling rate is unknown until hardware is selected. 100 Hz is a
# common research default; replace with actual hardware spec later.
eeg:
  sampling_rate_hz: 100          # TODO: replace with real hardware spec
  channel_names: []              # TODO: populate after electrode layout known
  reference: "unknown"           # "mastoid", "cz", "average", etc.
  unit: "uV"
  montage: "unknown"             # 10-20, 10-10, custom

# ── Data Loading & Quality ───────────────────────────────────────────
data:
  preload_edf: false             # false keeps large recordings memory efficient
  sampling_rate_tolerance_hz: 0.01
  quality:
    flatline_threshold_s: 5.0    # flag identical runs longer than this duration
    max_nan_ratio: 0.0           # per-channel ratio allowed for an overall pass
    std_ddof: 0                  # population standard deviation

# ── Preprocessing ────────────────────────────────────────────────────
# Research comparison profiles only — these are not final product parameters.
preprocessing:
  active_profile: "slow_oscillation_observation"
  eeg_channels: []               # supplied by a dataset config or CLI
  profiles:
    raw_eeg:
      reference:
        mode: "none"             # "none" | "average" | "channels"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: null
        high_hz: null
        method: "fir"
      detrend: "none"            # "none" | "demean" | "linear"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 0.0
    broadband_sleep_eeg:
      reference:
        mode: "none"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: 0.5
        high_hz: 30.0
        method: "fir"
      detrend: "demean"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 5.0
    slow_oscillation_observation:
      reference:
        mode: "none"
        channels: []
      notch_freqs_hz: []
      notch_method: "fir"
      bandpass:
        low_hz: 0.5
        high_hz: 4.0
        method: "fir"
      detrend: "demean"
      target_sampling_rate_hz: null
      resample_method: "fft"
      boundary_discard_s: 5.0

# ── N3 EEG Visualization ─────────────────────────────────────────────
n3_visualization:
  segment_id: null               # set to a representative segment per dataset
  preprocessing_profile: "slow_oscillation_observation"
  amplitude_scale: 1000000.0     # EDF volts -> displayed microvolts
  amplitude_unit: "µV"
  figure_width_inches: 14.0
  figure_height_per_channel_inches: 3.2
  dpi: 160
  raw_color: "#6B7280"
  processed_color: "#2563EB"
  raw_line_width: 0.7
  processed_line_width: 1.0
  raw_line_style: ":"
  processed_line_style: "-"
  grid_alpha: 0.18
  windows:
    long:
      offset_s: 60.0
      duration_s: 120.0
      output_path: "results/n3_eeg_long.png"
    short:
      offset_s: 90.0
      duration_s: 20.0
      output_path: "results/n3_eeg_short.png"
  summary_json: "results/n3_eeg_preprocessing_summary.json"
  json_indent: 2

# ── Sleep Staging ────────────────────────────────────────────────────
sleep_staging:
  # Unified label -> accepted raw dataset labels.
  stage_labels:
    W: ["Sleep stage W", "W", "Wake", "0"]
    N1: ["Sleep stage 1", "N1", "S1", "1"]
    N2: ["Sleep stage 2", "N2", "S2", "2"]
    N3: ["Sleep stage 3", "Sleep stage 4", "N3", "S3", "S4", "3", "4", "SWS"]
    REM: ["Sleep stage R", "R", "REM", "5"]
    UNKNOWN: ["Sleep stage ?", "UNKNOWN"]
    MOVEMENT: ["Movement time", "MOVEMENT"]
  unknown_label_policy: "map_to_unknown"  # "map_to_unknown" | "raise"
  unknown_label: "UNKNOWN"
  merge_tolerance_s: 0.0
  focus_stages: ["N2", "N3"]

# ── N3 Segment Extraction ────────────────────────────────────────────
n3_extraction:
  target_label: "N3"
  min_segment_duration_s: 30.0
  eeg_channels: []               # must be supplied by dataset config or CLI
  output_csv: "results/n3_segments.csv"
  output_json: "results/n3_segments.json"
  json_indent: 2

# ── Slow Oscillation Detection ───────────────────────────────────────
slow_oscillation:
  filter_low_hz: 0.5
  filter_high_hz: 4.0
  min_duration_ms: 250           # minimum half-wave duration
  max_duration_ms: 1000
  amplitude_threshold_uV: null   # null = auto from 75th percentile

# ── Phase Prediction ─────────────────────────────────────────────────
phase_prediction:
  method: "hilbert"              # "hilbert", "fixed_threshold", "state_space"
  lookahead_ms: 200              # how far ahead to predict
  prediction_horizon_ms: 500     # total prediction window
  phase_target_deg: [0, 180]     # target up-state onset or down-state onset

# ── Precision Gating ─────────────────────────────────────────────────
precision_gating:
  confidence_threshold: 0.8      # 0-1; skip trigger below this
  phase_error_tolerance_deg: 30  # ± degrees considered "on target"
  min_consecutive_good_cycles: 3

# ── Simulation (offline replay) ──────────────────────────────────────
simulation:
  buffer_duration_s: 30          # sliding window size
  step_size_ms: 100              # replay step
  trigger_mode: "log_only"       # "log_only" | "mock_output" — no real device

# ── Evaluation ────────────────────────────────────────────────────────
evaluation:
  metrics:
    - "phase_error_mae_deg"
    - "trigger_precision"
    - "trigger_recall"
    - "skip_rate"
  cross_validation_folds: 5

# ── Output ───────────────────────────────────────────────────────────
output:
  results_dir: "./results"
  save_figures: true
  figure_format: "png"
  dpi: 150
