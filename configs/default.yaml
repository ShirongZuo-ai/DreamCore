# ── Deterministic Physiological Sonification V1 ─────────────────────
# These are inspectable musical mappings, not physiological meanings and not
# therapeutic parameters. Browser output is normalized below unity.
sonification:
  mapping_version: "sonification-mapping-v1"
  control_version: "sonification-control-v1"
  seed: 42
  eye_movement:
    tempo_bpm: {minimum: 54.0, maximum: 108.0, event_rate_max_per_min: 20.0}
    density: {minimum: 0.08, maximum: 0.90}
    intensity: {minimum: 0.05, maximum: 0.55}
    brightness_hz: {minimum: 240.0, maximum: 2400.0}
    midi_scale: [48, 50, 53, 55, 57, 60, 62, 65]
    velocity: {minimum: 0.10, maximum: 0.70}
  alpha_comparison:
    source_channel: null
    low_quantile: 0.05
    high_quantile: 0.95
    tempo_bpm: {minimum: 48.0, maximum: 84.0}
    density: {minimum: 0.05, maximum: 0.55}
    intensity: {minimum: 0.04, maximum: 0.35}
    brightness_hz: {minimum: 180.0, maximum: 1400.0}
    midi_scale: [45, 48, 52, 55, 57, 60]
  baseline:
    tempo_bpm: 60.0
    density: 1.0
    intensity: 0.20
    brightness_hz: 1200.0
    midi_note: 60
  audio:
    master_gain: 0.16
    minimum_rendered_velocity: 0.12
    attack_s: 0.01
    release_s: 0.24
    note_duration_s: 0.16
    oscillator_type: "sine"
    filter_q: 0.7
    test_sound:
      midi_note: 69
      velocity: 0.35
      brightness_hz: 2400.0
      duration_s: 0.25
  output:
    controls_csv: "results/sonification_control_v1.csv"
    json_indent: 2

# ── AI Wake Music V1 ────────────────────────────────────────────────
# Exploratory, post-waking generative music. DreamCore maps existing EOG
# features into bounded musical directions before the provider is called.
# These settings are product-generation constraints, not physiological facts.
wake_music:
  profile_version: "dreamcore.wake_music.profile.v1"
  mapping_version: "wake_music_mapping.v1"
  default_generation_seed: 42
  seed_increment: 1
  source_feature_metric: "eye_movement_activity_v1"
  playback:
    strategy: "first_excerpt_v1"
    excerpt_start_s: 0.0
    default_excerpt_seconds: 60.0
    fade_out_seconds: 3.0
    wake_audio_filename: "wake_music_60s.mp3"
    audio_codec: "libmp3lame"
    audio_bitrate: "256k"
    ffmpeg_executable: "ffmpeg"
    ffprobe_executable: "ffprobe"
    processing_timeout_s: 180.0
    duration_tolerance_s: 0.1
  wake_window:
    duration_s: 600.0
    wake_stage_label: "W"
    annotation_type: "sleep_stages"
    transition_gap_tolerance_s: 0.0
    minimum_feature_rows: 30
  mapping:
    activity_register_thresholds: {low_max: 0.33, middle_max: 0.66}
    event_rate_density_thresholds_per_min: {sparse_max: 2.0, moderate_max: 8.0}
    trend_thresholds_per_min:
      stable_absolute_max: 0.01
      strongly_rising_min: 0.05
    amplitude_expression_thresholds: {delicate_max: 0.33, natural_max: 0.66}
    auto_style_candidates:
      warm: ["soft_piano_ambient", "calm_ambient", "gentle_acoustic", "classical_chamber"]
      gradually_brighter: ["bright_morning", "neoclassical", "gentle_acoustic", "soft_piano_ambient"]
      noticeably_brighter: ["bright_morning", "neoclassical", "classical_chamber"]
  constraints:
    max_energy: "moderate"
    max_percussiveness: "low_to_moderate"
    allow_aggressive_styles: false
    allow_vocals: false
  prompt_phrases:
    register:
      low: "Keep the main melody in a comfortable lower register."
      mid: "Keep the main melody primarily in a clear middle register."
      high: "Use a somewhat higher melodic register while keeping the tone soft."
    density:
      sparse: "Use sparse melodic activity with generous breathing room."
      moderate: "Use moderate melodic activity with unhurried phrasing."
      moderately_active: "Use somewhat richer note activity, capped at moderately active; never rapid or frantic."
    brightness:
      warm: "Keep the texture warm, soft, and stable throughout."
      gradually_brighter: "Begin warm and gradually become brighter and clearer."
      noticeably_brighter: "Become noticeably brighter and more awake, while remaining gentle."
    expression:
      delicate: "Use delicate expressive strength and restrained dynamics."
      natural: "Use natural expressive strength with smooth dynamics."
      slightly_more_present: "Use a slightly more present expression without aggressive loudness."
    ending:
      stable: "End with a warm, gentle, resolved morning cadence."
      slightly_rising: "End with a bright, gentle, resolved morning cadence."
      rising: "End clearly and brightly with a gentle resolved cadence, without a climax."
  styles:
    soft_piano_ambient:
      label: "Soft & Calm"
      description: "Soft piano, warm ambient pads, slow-to-moderate movement, and minimal percussion."
      variants:
        - "intimate felt piano with a quiet halo of warm pads"
        - "soft grand piano with airy sustained ambience"
        - "minimal piano figures with a restrained warm drone"
        - "gentle piano arpeggios with spacious, diffused pads"
    bright_morning:
      label: "Bright Morning"
      description: "Bright acoustic piano, light strings or woodwinds, fresh harmony, and gentle rhythmic motion."
      variants:
        - "bright acoustic piano with light flute and restrained strings"
        - "clear piano with soft woodwinds and a subtle morning pulse"
        - "fresh piano motifs with delicate pizzicato and sustained strings"
        - "warm piano, quiet clarinet, and gently moving string harmony"
    classical_chamber:
      label: "Classical"
      description: "Classical instrumental writing for piano and a small light-string ensemble, without a dramatic climax."
      variants:
        - "piano with light strings"
        - "piano, cello, and soft violin"
        - "small chamber ensemble with piano"
        - "impressionist piano with restrained strings"
    neoclassical:
      label: "Neo-Classical"
      description: "Minimalist piano, soft strings, modern classical texture, and clear repeating motifs."
      variants:
        - "minimal piano ostinato with a warm cello line"
        - "clear repeating piano motif with soft violin harmonics"
        - "modern chamber piano with restrained layered strings"
        - "gentle impressionist piano patterns with a quiet string trio"
    gentle_acoustic:
      label: "Gentle Acoustic"
      description: "Acoustic guitar and piano with a soft organic texture and warm morning feeling."
      variants:
        - "fingerstyle acoustic guitar with delicate piano responses"
        - "soft nylon guitar, warm piano, and a light bowed texture"
        - "quiet acoustic guitar patterns with sparse upright piano"
        - "organic guitar and piano duet with subtle string warmth"
    calm_ambient:
      label: "Ambient"
      description: "Warm ambient pads, very light melodic material, and a soft spacious instrumental texture."
      variants:
        - "warm evolving pads with a few bell-like piano tones"
        - "spacious soft synthesizer layers with a restrained piano motif"
        - "slow ambient harmony with delicate mallet-like accents"
        - "airy pads and a minimal, rounded keyboard melody"
  provider:
    name: "minimax"
    model: "music-2.6-free"
    api_base_url: "https://api.minimax.io"
    endpoint_path: "/v1/music_generation"
    stream: false
    output_format: "url"
    is_instrumental: true
    lyrics_optimizer: false
    request_timeout_s: 900.0
    download_timeout_s: 60.0
    maximum_download_bytes: 52428800
    audio_setting: {sample_rate: 44100, bitrate: 256000, format: "mp3"}
  storage:
    root: "results/wake_music"
    audio_filename: "wake_music.mp3"
    profile_filename: "profile.json"
    prompt_filename: "prompt.txt"
    metadata_filename: "metadata.json"
    json_indent: 2
  api:
    prefix: "/api/wake-music"
    maximum_request_bytes: 16384

# ── Phase Prediction ─────────────────────────────────────────────────
phase_prediction:
  method: "hilbert"              # "hilbert", "fixed_threshold", "state_space"
  lookahead_ms: 200              # how far ahead to predict
  prediction_horizon_ms: 500     # total prediction window
  phase_target_deg: [0, 180]     # target up-state onset or down-state onset

# ── Precision Gating ─────────────────────────────────────────────────
precision_gating:
  confidence_threshold: 0.8      # 0-1; skip trigger below this
  phase_error_tolerance_deg: 30  # ± degrees considered "on target"
  min_consecutive_good_cycles: 3

# ── Simulation (offline replay) ──────────────────────────────────────
simulation:
  buffer_duration_s: 30          # sliding window size
  step_size_ms: 100              # replay step
  trigger_mode: "log_only"       # "log_only" | "mock_output" — no real device

# ── Evaluation ────────────────────────────────────────────────────────
evaluation:
  metrics:
    - "phase_error_mae_deg"
    - "trigger_precision"
    - "trigger_recall"
    - "skip_rate"
  cross_validation_folds: 5

# ── Output ───────────────────────────────────────────────────────────
output:
  results_dir: "./results"
  save_figures: true
  figure_format: "png"
  dpi: 150
